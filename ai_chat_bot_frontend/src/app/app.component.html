<!-- AI Chat Bot Main Interface -->
<div class="container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Menu</span>
    </div>
    <nav class="sidebar-menu">
      <button class="sidebar-btn" [class.active]="selectedTab==='chat'" (click)="selectedTab='chat'">
        <span class="icon">💬</span> Chat
      </button>
      <button class="sidebar-btn" [class.active]="selectedTab==='history'" (click)="selectedTab='history'">
        <span class="icon">🕓</span> History
      </button>
      <button class="sidebar-btn" [class.active]="selectedTab==='settings'" (click)="selectedTab='settings'">
        <span class="icon">⚙️</span> Settings
      </button>
    </nav>
    <!-- Content for tab panel -->
    <div class="sidebar-panel">
      <ng-container [ngSwitch]="selectedTab">
        <app-message-history *ngSwitchCase="'history'"></app-message-history>
        <app-chat-settings *ngSwitchCase="'settings'"></app-chat-settings>
        <div *ngSwitchDefault class="sidebar-info">
          <p class="info-desc">Welcome! Start chatting with the AI bot.</p>
        </div>
      </ng-container>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <span class="chat-title">{{ title }}</span>
      <app-bot-status-indicator></app-bot-status-indicator>
    </header>
    <section class="chat-container">
      <app-chat-window></app-chat-window>
    </section>
  </main>
</div>
